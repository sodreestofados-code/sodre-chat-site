<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Sodré Estofados</title>

<style>

body{
font-family:Arial;
background:#ece5dd;
margin:0;
}

#chat{

height:80vh;
overflow:auto;
padding:20px;

}

.msg{

padding:10px;
border-radius:10px;
margin:10px;
max-width:70%;

}

.user{

background:#dcf8c6;
margin-left:auto;

}

.bot{

background:white;

}

#barra{

position:fixed;
bottom:0;
width:100%;
background:white;
padding:10px;
display:flex;
gap:10px;

}

input{

flex:1;
padding:10px;
border-radius:20px;
border:1px solid #ccc;

}

button{

background:#25d366;
border:none;
color:white;
padding:10px 20px;
border-radius:20px;
cursor:pointer;

}

</style>

</head>

<body>

<div id="chat"></div>

<div id="barra">

<input id="mensagem" placeholder="Digite sua mensagem">

<button onclick="enviar()">Enviar</button>

</div>

<script>

async function enviar(){

let mensagem = document.getElementById("mensagem").value;

if(!mensagem) return;

let chat = document.getElementById("chat");

chat.innerHTML += `<div class="msg user">${mensagem}</div>`;

document.getElementById("mensagem").value="";

let resposta = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
message: mensagem
})

});

let data = await resposta.json();

chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;

chat.scrollTop = chat.scrollHeight;

}

</script>

</body>

</html>
