<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sodré Estofados</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

/* HEADER */

header{
background:#00a859;
padding:15px;
display:flex;
align-items:center;
gap:10px;
}

#menuBtn{
font-size:25px;
cursor:pointer;
}

/* MENU */

#menu{
position:fixed;
top:0;
left:-250px;
width:250px;
height:100%;
background:#111;
padding:20px;
transition:0.3s;
z-index:999;
}

#menu span{
display:block;
margin:15px 0;
cursor:pointer;
}

/* CHAT */

#chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

/* MENSAGENS */

.msg{
padding:10px;
border-radius:10px;
max-width:75%;
word-break:break-word;
}

.user{
background:#00a859;
align-self:flex-end;
}

.bot{
background:#1e1e1e;
align-self:flex-start;
}

/* BARRA */

#barra{
display:flex;
gap:5px;
padding:8px;
background:#000;
align-items:center;
}

#mais,#audio{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

#mensagem{
flex:1;
padding:10px;
border-radius:20px;
border:none;
}

#enviar{
background:#00a859;
border:none;
padding:10px;
border-radius:20px;
color:white;
}

img,video,audio{
max-width:200px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<span id="menuBtn">☰</span>
<b>Sodré Estofados</b>
</header>

<div id="menu">
<span>⭐ Avaliações</span>
<span onclick="window.open('https://www.instagram.com/sodre.etf')">Instagram</span>
<span onclick="window.open('https://w.app/dlnbrp')">WhatsApp</span>
</div>

<div id="chat"></div>

<input type="file" id="file" accept="image/*,video/*" hidden>

<div id="barra">

<button id="mais">+</button>

<input id="mensagem" placeholder="Digite...">

<button id="audio">🎤</button>

<button id="enviar">➤</button>

</div>

<script>

/* MENU */

document.getElementById("menuBtn").onclick = () => {
let m = document.getElementById("menu")
m.style.left = m.style.left === "0px" ? "-250px" : "0px"
}

/* FOTO / VIDEO */

document.getElementById("mais").onclick = () => {
document.getElementById("file").click()
}

document.getElementById("file").onchange = (e) => {

let file = e.target.files[0]
if(!file) return

let chat = document.getElementById("chat")
let url = URL.createObjectURL(file)

if(file.type.startsWith("image")){
chat.innerHTML += `<div class="msg user"><img src="${url}"></div>`
}

if(file.type.startsWith("video")){
chat.innerHTML += `<div class="msg user"><video src="${url}" controls></video></div>`
}

}

/* AUDIO REAL */

let recorder
let audioChunks = []

document.getElementById("audio").onmousedown = async () => {

let stream = await navigator.mediaDevices.getUserMedia({audio:true})

recorder = new MediaRecorder(stream)

recorder.start()

audioChunks = []

recorder.ondataavailable = e => {
audioChunks.push(e.data)
}

}

document.getElementById("audio").onmouseup = () => {

recorder.stop()

recorder.onstop = () => {

let blob = new Blob(audioChunks)
let url = URL.createObjectURL(blob)

let chat = document.getElementById("chat")

chat.innerHTML += `
<div class="msg user">
<audio controls src="${url}"></audio>
</div>
`

}

}

/* ENVIO TEXTO */

document.getElementById("enviar").onclick = async () => {

let msg = document.getElementById("mensagem").value
if(!msg) return

let chat = document.getElementById("chat")

chat.innerHTML += `<div class="msg user">${msg}</div>`

document.getElementById("mensagem").value = ""

let res = await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({message: msg})
})

let data = await res.json()

chat.innerHTML += `<div class="msg bot">${data.reply}</div>`

chat.scrollTop = chat.scrollHeight

}

</script>

</body>
</html>
