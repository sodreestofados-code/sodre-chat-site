<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Chat Sodré</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

#chat{
background:white;
height:400px;
overflow:auto;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

</style>

</head>

<body>

<h2>Chat Sodré Estofados</h2>

<div id="chat"></div>

<input id="mensagem" placeholder="Digite sua mensagem">

<button onclick="enviar()">Enviar</button>

<script>

async function enviar(){

let mensagem = document.getElementById("mensagem").value;

let chat = document.getElementById("chat");

chat.innerHTML += "<p><b>Você:</b> "+mensagem+"</p>";

document.getElementById("mensagem").value="";

let resposta = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
message: mensagem
})

});

let data = await resposta.json();

chat.innerHTML += "<p><b>Júlia:</b> "+data.reply+"</p>";

chat.scrollTop = chat.scrollHeight;

}

</script>

</body>

</html>
