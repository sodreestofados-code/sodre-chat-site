<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sodré Estofados</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

/* CABEÇALHO */

header{
background:#00a859;
padding:15px;
display:flex;
align-items:center;
gap:15px;
}

#menuBtn{
font-size:24px;
cursor:pointer;
}

/* MENU LATERAL */

#menu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#111;
padding:25px;
transition:0.3s;
z-index:1000;
}

#menu h2{
margin-top:0;
}

#menu span{
display:block;
margin:18px 0;
font-size:18px;
cursor:pointer;
}

/* CHAT */

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:12px;
border-radius:12px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#00a859;
align-self:flex-end;
}

.bot{
background:#1e1e1e;
align-self:flex-start;
}

/* BARRA INFERIOR */

#barra{
display:flex;
gap:8px;
padding:10px;
background:black;
align-items:center;
}

#mais{
background:none;
border:none;
color:white;
font-size:24px;
cursor:pointer;
}

#audio{
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

input{
flex:1;
padding:12px;
border-radius:20px;
border:none;
outline:none;
}

#enviar{
background:#00a859;
border:none;
color:white;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
}

/* IMAGEM E VIDEO */

.chatImg{
max-width:200px;
border-radius:10px;
}

.chatVideo{
max-width:220px;
border-radius:10px;
}

</style>

</head>

<body>

<header>

<span id="menuBtn" onclick="abrirMenu()">☰</span>
<strong>Sodré Estofados</strong>

</header>

<!-- MENU LATERAL -->

<div id="menu">

<h2>Menu</h2>

<span onclick="alert('Avaliações em breve')">⭐ Avaliações</span>

<span onclick="window.open('https://www.instagram.com/sodre.etf','_blank')">
📱 Instagram
</span>

<span onclick="window.open('https://www.facebook.com/share/183L2WntUW/','_blank')">
📘 Facebook
</span>

<span onclick="window.open('https://w.app/dlnbrp','_blank')">
💬 WhatsApp
</span>

<span onclick="alert('Área administrador em construção')">
🔒 Administrador
</span>

</div>

<!-- CHAT -->

<div id="chat"></div>

<!-- INPUT FOTO/VIDEO -->

<input type="file" id="arquivo" accept="image/*,video/*" style="display:none">

<!-- BARRA DE MENSAGEM -->

<div id="barra">

<button id="mais" onclick="abrirArquivo()">+</button>

<input id="mensagem" placeholder="Digite sua mensagem">

<button id="audio">🎤</button>

<button id="enviar" onclick="enviar()">Enviar</button>

</div>

<script>

function abrirMenu(){

let menu = document.getElementById("menu")

if(menu.style.left === "0px"){
menu.style.left = "-260px"
}else{
menu.style.left = "0px"
}

}

function abrirArquivo(){
document.getElementById("arquivo").click()
}

document.getElementById("arquivo")
.addEventListener("change", function(){

let file = this.files[0]

if(!file) return

let chat = document.getElementById("chat")

let url = URL.createObjectURL(file)

if(file.type.startsWith("image")){

chat.innerHTML += `
<div class="msg user">
<img src="${url}" class="chatImg">
</div>
`

}

if(file.type.startsWith("video")){

chat.innerHTML += `
<div class="msg user">
<video src="${url}" controls class="chatVideo"></video>
</div>
`

}

chat.scrollTop = chat.scrollHeight

})

async function enviar(){

let mensagem = document.getElementById("mensagem").value

if(!mensagem) return

let chat = document.getElementById("chat")

chat.innerHTML += `
<div class="msg user">${mensagem}</div>
`

document.getElementById("mensagem").value=""

let resposta = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
message: mensagem
})

})

let data = await resposta.json()

chat.innerHTML += `
<div class="msg bot">${data.reply}</div>
`

chat.scrollTop = chat.scrollHeight

}

</script>

</body>

</html>
