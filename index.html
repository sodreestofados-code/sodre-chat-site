<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sodré Estofados</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

/* CABEÇALHO */

header{

background:#00a859;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;

}

header h1{
font-size:18px;
margin:0;
}

/* MENU */

#menu{

display:flex;
gap:15px;
font-size:14px;

}

#menu span{
cursor:pointer;
}

/* CHAT */

#chat{

height:70vh;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;

}

.msg{

padding:12px;
border-radius:12px;
max-width:80%;
word-wrap:break-word;

}

.user{
background:#00a859;
align-self:flex-end;
}

.bot{
background:#1e1e1e;
}

/* BARRA INFERIOR */

#barra{

position:fixed;
bottom:0;
width:100%;
display:flex;
gap:8px;
background:black;
padding:10px;

}

#mais{

background:#00a859;
border:none;
color:white;
width:40px;
height:40px;
border-radius:50%;
font-size:20px;
cursor:pointer;

}

input{

flex:1;
padding:10px;
border-radius:20px;
border:none;

}

button{

background:#00a859;
border:none;
color:white;
padding:10px 15px;
border-radius:20px;
cursor:pointer;

}

/* MENU ANEXOS */

#anexos{

position:fixed;
bottom:70px;
left:10px;
background:#1e1e1e;
padding:10px;
border-radius:10px;
display:none;
flex-direction:column;
gap:8px;

}

#anexos span{
cursor:pointer;
}

/* PAGINAS */

.pagina{

display:none;
padding:20px;

}

</style>

</head>

<body>

<header>

<h1>Sodré Estofados</h1>

<div id="menu">

<span onclick="abrir('chatPagina')">Chat</span>
<span onclick="abrir('avaliacoes')">Avaliações</span>
<span onclick="abrir('redes')">Redes</span>
<span onclick="abrir('admin')">Admin</span>

</div>

</header>

<!-- CHAT -->

<div id="chatPagina">

<div id="chat"></div>

</div>

<!-- AVALIAÇÕES -->

<div id="avaliacoes" class="pagina">

<h2>Avaliações</h2>

⭐️⭐️⭐️⭐️⭐️  
"Meu sofá ficou novo!"  

⭐️⭐️⭐️⭐️⭐️  
"Atendimento excelente."

</div>

<!-- REDES -->

<div id="redes" class="pagina">

<h2>Redes Sociais</h2>

<p>WhatsApp</p>
<p>Instagram</p>
<p>Facebook</p>

</div>

<!-- ADMIN -->

<div id="admin" class="pagina">

<h2>Área Administrador</h2>

<p>Painel em desenvolvimento.</p>

</div>

<!-- MENU ANEXOS -->

<div id="anexos">

<span>📷 Foto</span>
<span>🎥 Vídeo</span>
<span>🎤 Áudio</span>

</div>

<!-- BARRA CHAT -->

<div id="barra">

<button id="mais" onclick="abrirAnexos()">+</button>

<input id="mensagem" placeholder="Digite sua mensagem...">

<button onclick="enviar()">Enviar</button>

</div>

<script>

function abrir(pagina){

document.getElementById("chatPagina").style.display="none"
document.getElementById("avaliacoes").style.display="none"
document.getElementById("redes").style.display="none"
document.getElementById("admin").style.display="none"

document.getElementById(pagina).style.display="block"

}

function abrirAnexos(){

let menu = document.getElementById("anexos")

menu.style.display =
menu.style.display === "flex" ? "none" : "flex"

}

async function enviar(){

let mensagem = document.getElementById("mensagem").value

if(!mensagem) return

let chat = document.getElementById("chat")

chat.innerHTML += `<div class="msg user">${mensagem}</div>`

document.getElementById("mensagem").value=""

let resposta = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
message: mensagem
})

})

let data = await resposta.json()

chat.innerHTML += `<div class="msg bot">${data.reply}</div>`

chat.scrollTop = chat.scrollHeight

}

</script>

</body>

</html>
