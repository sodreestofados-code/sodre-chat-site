<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sodré Estofados</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

/* CABEÇALHO */

header{
background:#00a859;
padding:15px;
text-align:center;
font-weight:bold;
font-size:18px;
}

/* AREA DO CHAT */

#chat{

flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;

}

/* BOLHAS */

.msg{

padding:12px;
border-radius:12px;
max-width:80%;
word-wrap:break-word;
line-height:1.4;

}

/* MENSAGEM CLIENTE */

.user{

background:#00a859;
align-self:flex-end;
color:white;

}

/* MENSAGEM IA */

.bot{

background:#1e1e1e;
align-self:flex-start;
color:white;

}

/* BARRA DE MENSAGEM */

#barra{

display:flex;
padding:10px;
background:black;
gap:10px;

}

input{

flex:1;
padding:12px;
border-radius:20px;
border:none;
outline:none;
font-size:16px;

}

button{

background:#00a859;
border:none;
color:white;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
cursor:pointer;

}

button:active{

transform:scale(0.95);

}

</style>

</head>

<body>

<header>

Sodré Estofados • Atendimento

</header>

<div id="chat"></div>

<div id="barra">

<input id="mensagem" placeholder="Digite sua mensagem...">

<button onclick="enviar()">Enviar</button>

</div>

<script>

async function enviar(){

let mensagem = document.getElementById("mensagem").value;

if(!mensagem) return;

let chat = document.getElementById("chat");

chat.innerHTML += `<div class="msg user">${mensagem}</div>`;

document.getElementById("mensagem").value="";

chat.scrollTop = chat.scrollHeight;

let resposta = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
message: mensagem
})

});

let data = await resposta.json();

chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;

chat.scrollTop = chat.scrollHeight;

}

/* ENTER PARA ENVIAR */

document.getElementById("mensagem")
.addEventListener("keypress", function(e){

if(e.key === "Enter"){
enviar();
}

});

</script>

</body>

</html>
